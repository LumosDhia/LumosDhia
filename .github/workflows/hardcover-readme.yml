name: Hardcover Readme

on:
  schedule:
    # run every day at 06:00
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Currently Reading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install Pillow

      - name: Update reading widget
        env:
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
        run: python3 .github/scripts/hardcover_readme.py Readme.md

      - name: Commit and push if changed
        run: |
          git config user.name "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md assets/reading_card_light.png assets/reading_card_dark.png
          git diff --staged --quiet || git commit -m "Update currently reading widget"
          git push
