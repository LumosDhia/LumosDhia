name: Waka Readme
# Disabled: the coding-stats section was removed from the README, so there is
# nothing for this action to update. To turn it back on, re-add the START_SECTION:waka /
# END_SECTION:waka markers to the README, restore the schedule trigger below,
# and remove `if: false` from the job.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    if: false
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_SHORT_INFO: False
          SHOW_PROFILE_VIEWS: False
          SHOW_LOC_CHART: False
          SHOW_COMMIT: False
          SHOW_OS: False
          SHOW_TIMEZONE: False
          SHOW_EDITORS: False
          SHOW_LANGUAGE_PER_REPO: False
          SHOW_AI_CODE_TIME: False
          SHOW_AI_CODING: False
